<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CARAT LAND MART</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

<style>
body{font-family:'Segoe UI';background:#fff;}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 20px;
  border-bottom:1px solid #eee;
  background:white;
}
.brand{font-weight:900;color:#6fa8dc;}

.hero img{width:100%;height:400px;object-fit:cover;}

.tabs{display:flex;gap:10px;margin:20px;}
.tab{border:1px solid #ddd;padding:5px 12px;border-radius:20px;cursor:pointer;}

.product{border:1px solid #eee;padding:10px;border-radius:10px;text-align:center;}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;}

.btn-svt{background:#f4a7b9;color:white;border:none;width:100%;}

.box{border:1px solid #eee;padding:10px;border-radius:10px;}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
}

.remove{
  background:red;
  color:white;
  border:none;
  font-size:12px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">CARATLAND MART</div>
  <a href="aboutteam.html">About Us</a>
</div>

<div class="hero">
  <img src="https://jsjuco2029.github.io/CARATLAND.png">
</div>

<div class="container-fluid">
<div class="row">

<div class="col-lg-8">

<div class="row">

<div class="col-md-4 item albums">
<div class="product">
<img src="https://jsjuco2029.github.io/SVTALBUM1.png">
<p>HAPPY BURSTDAY</p><p>₱2801</p>
<button class="btn-svt" onclick="add('HAPPY BURSTDAY',2801)">Add</button>
</div>
</div>

<div class="col-md-4 item albums">
<div class="product">
<img src="https://jsjuco2029.github.io/SVTALBUM2.png">
<p>SPILL THE FEELS</p><p>₱2703</p>
<button class="btn-svt" onclick="add('SPILL THE FEELS',2703)">Add</button>
</div>
</div>

<div class="col-md-4 item albums">
<div class="product">
<img src="https://jsjuco2029.github.io/SVTALBUM3.png">
<p>FML</p><p>₱2514</p>
<button class="btn-svt" onclick="add('FML',2514)">Add</button>
</div>
</div>

<div class="col-md-4 item albums">
<div class="product">
<img src="https://jsjuco2029.github.io/SVTALBUM4.png">
<p>17 CARAT</p><p>₱447</p>
<button class="btn-svt" onclick="add('17 CARAT',447)">Add</button>
</div>
</div>

<div class="col-md-4 item albums">
<div class="product">
<img src="https://jsjuco2029.github.io/SVTALBUM5.png">
<p>ATTACCA</p><p>₱2323</p>
<button class="btn-svt" onclick="add('ATTACCA',2323)">Add</button>
</div>
</div>

</div>
</div>

<div class="col-lg-4">

<div class="box">
<h5>Cart (<span id="count">0</span>)</h5>
<div id="cart"></div>
<h6>Total: ₱<span id="total">0</span></h6>

<form onsubmit="return checkout()">
<input name="cust_name" class="form-control mb-2" placeholder="Name" required>
<input name="cust_addr" class="form-control mb-2" placeholder="Address" required>
<input name="cust_email" class="form-control mb-2" type="email" placeholder="Email" required>

<input type="hidden" name="cust_order" id="cust_order">

<button class="btn btn-dark w-100">Checkout</button>
</form>

</div>
</div>

</div>
</div>

<script>

let cart = [];

function add(name, price){
  let found = cart.find(i => i.name === name);

  if(found){
    found.qty += 1;
  } else {
    cart.push({name, price, qty:1});
  }

  render();
}

function render(){
  let html = "";
  let total = 0;

  for(let i=0;i<cart.length;i++){
    let itemTotal = cart[i].price * cart[i].qty;
    total += itemTotal;

    html += `
      <div class="cart-item">
        ${cart[i].name} x${cart[i].qty} ₱${itemTotal}
        <button class="remove" onclick="removeItem(${i})">x</button>
      </div>
    `;
  }

  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText = total;
  document.getElementById("count").innerText = cart.length;
}

function removeItem(i){
  cart.splice(i,1);
  render();
}

function checkout(){
  if(cart.length === 0){
    alert("Cart is empty!");
    return false;
  }

  let order = cart.map(i => ({
    prod_name: i.name + " x" + i.qty,
    prod_price: i.price * i.qty
  }));

  document.getElementById("cust_order").value = JSON.stringify(order);

  return true;
}

</script>

</body>
</html>
