<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CARAT LAND MART</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#fff;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  border-bottom:1px solid #ddd;
}

.brand{
  font-weight:bold;
  color:#6fa8dc;
  font-size:20px;
}

.topbar a{
  text-decoration:none;
  color:#fff;
  background:#6fa8dc;
  padding:6px 12px;
  border-radius:20px;
}

.hero img{
  width:100%;
  height:350px;
  object-fit:cover;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:15px;
}

.tab{
  padding:6px 12px;
  border:1px solid #ccc;
  border-radius:20px;
  cursor:pointer;
}

.container{
  display:flex;
  gap:20px;
  padding:20px;
}

.products{
  flex:3;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  border:1px solid #eee;
  padding:10px;
  text-align:center;
  border-radius:10px;
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.btn{
  background:#f4a7b9;
  color:white;
  border:none;
  padding:6px;
  width:100%;
  cursor:pointer;
}

.cart{
  flex:1;
  border:1px solid #ddd;
  padding:10px;
  border-radius:10px;
}

.item{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:5px;
}

.remove{
  background:red;
  color:white;
  border:none;
  font-size:10px;
}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  width:250px;
}

.qty-controls button{
  padding:5px 10px;
  margin:5px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">CARATLAND MART</div>
  <a href="./aboutteam.html">About Us</a>
</div>

<div class="hero">
  <img src="https://jsjuco2029.github.io/CARATLAND.png">
</div>

<div class="tabs">
  <div class="tab" onclick="filter('all')">All</div>
  <div class="tab" onclick="filter('albums')">Albums</div>
  <div class="tab" onclick="filter('merch')">Merch</div>
  <div class="tab" onclick="filter('miniteen')">MINITEEN</div>
  <div class="tab" onclick="filter('media')">DVD/MEDIA</div>
</div>

<div class="container">

<div class="products">

<div class="card" data-type="albums">
<img src="https://jsjuco2029.github.io/SVTALBUM1.png">
<p>HAPPY BURSTDAY</p><p>₱2801</p>
<button class="btn" onclick="add('HAPPY BURSTDAY',2801)">Add</button>
</div>

<div class="card" data-type="albums">
<img src="https://jsjuco2029.github.io/SVTALBUM2.png">
<p>SPILL THE FEELS</p><p>₱2703</p>
<button class="btn" onclick="add('SPILL THE FEELS',2703)">Add</button>
</div>

</div>

<div class="cart">
<h3>Cart (<span id="count">0</span>)</h3>
<div id="cart"></div>
<h4>Total: ₱<span id="total">0</span></h4>

<form method="GET"
action="http://52.74.133.173/cs3/checkout.php"
onsubmit="return checkout()">

<input name="cust_name" placeholder="Name" required><br><br>
<input name="cust_addr" placeholder="Address" required><br><br>
<input name="cust_email" placeholder="Email" required><br><br>

<input type="hidden" name="cust_order" id="cust_order">

<button type="submit" class="btn">Checkout</button>
</form>

</div>
</div>

<div class="modal" id="quantityModal">
  <div class="modal-box">
    <h3 id="modalProductName"></h3>

    <div class="qty-controls">
      <button onclick="adjustQty(-1)">-</button>
      <span id="modalQty">1</span>
      <button onclick="adjustQty(1)">+</button>
    </div>

    <br>

    <button class="btn" onclick="confirmAdd()">Confirm</button>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('caratCart')) || [];
let modalProduct = null;
let modalQty = 1;

function add(name, price){
  const existing = cart.find(i => i.prod_name === name);

  modalProduct = { name, price };
  modalQty = existing ? existing.quantity : 1;

  document.getElementById("modalProductName").innerText = name;
  document.getElementById("modalQty").innerText = modalQty;

  document.getElementById("quantityModal").classList.add("active");
}

function closeModal(){
  document.getElementById("quantityModal").classList.remove("active");
  modalProduct = null;
}

function adjustQty(x){
  modalQty += x;
  if(modalQty < 1) modalQty = 1;
  document.getElementById("modalQty").innerText = modalQty;
}

function confirmAdd(){
  if(!modalProduct) return;

  const index = cart.findIndex(i => i.prod_name === modalProduct.name);

  if(index >= 0){
    cart[index].quantity = modalQty;
  } else {
    cart.push({
      prod_name: modalProduct.name,
      prod_price: modalProduct.price,
      quantity: modalQty
    });
  }

  save();
  render();
  closeModal();
}

function removeItem(i){
  cart.splice(i,1);
  save();
  render();
}

function save(){
  localStorage.setItem("caratCart", JSON.stringify(cart));
}

function render(){
  let total = 0;
  let html = "";

  cart.forEach((item,i)=>{
    total += item.prod_price * item.quantity;

    html += `
      <div class="item">
        ${item.prod_name} (x${item.quantity})
        <button class="remove" onclick="removeItem(${i})">x</button>
      </div>
    `;
  });

  document.getElementById("cart").innerHTML = html || "Empty cart";
  document.getElementById("total").innerText = total;
  document.getElementById("count").innerText = cart.length;
}

function checkout(){
  if(cart.length === 0){
    alert("Cart is empty!");
    return false;
  }

  let order = cart.map(i => ({
    prod_name: i.quantity > 1 ? i.prod_name + " (x" + i.quantity + ")" : i.prod_name,
    prod_price: i.prod_price * i.quantity
  }));

  document.getElementById("cust_order").value = JSON.stringify(order);

  return true;
}

render();
</script>

</body>
</html>
